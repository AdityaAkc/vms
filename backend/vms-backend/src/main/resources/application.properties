spring.application.name=vms-backend

# Database Configuration (PostgreSQL)
# Defaults target a local dev database; override with environment variables in other environments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vms}
spring.datasource.username=${DB_USERNAME:vms}
spring.datasource.password=${DB_PASSWORD:vms}

# JPA / Hibernate
# Hibernate detects the PostgreSQL dialect from the JDBC connection, so no dialect property is needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server Port (optional)
server.port=8080
